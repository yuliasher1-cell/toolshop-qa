name: Start Toolshop
description: Starts the Toolshop demo app with Docker (UI on :4200, API on :8091) and seeds the database.

inputs:
  sprint-folder:
    description: Which build to run. "sprint5" is the normal app, "sprint5-with-bugs" the buggy one.
    default: sprint5

runs:
  using: composite
  steps:
    - name: Get Toolshop sources
      shell: bash
      run: git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git "$RUNNER_TEMP/toolshop"

    - name: Select build
      shell: bash
      working-directory: ${{ runner.temp }}/toolshop
      run: |
        # docker-compose.yml mounts ./${SPRINT}/API, and the repository's .env sets SPRINT.
        echo "SPRINT=${{ inputs.sprint-folder }}" > .env
        cat .env
        ls -a "${{ inputs.sprint-folder }}/API" | grep -i "^\.env" || true

    - name: Start containers
      shell: bash
      working-directory: ${{ runner.temp }}/toolshop
      run: docker compose up -d --build

    - name: Wait for dependencies to install
      shell: bash
      working-directory: ${{ runner.temp }}/toolshop
      run: |
        # The composer container installs the PHP packages; the API returns 500 until it is done.
        for i in $(seq 1 60); do
          state=$(docker compose ps -a composer --format '{{.State}}' 2>/dev/null | head -n1)
          echo "composer: ${state:-unknown} (check $i)"
          if [ "$state" = "exited" ]; then
            docker compose ps -a composer --format '{{.ExitCode}}' | head -n1
            exit 0
          fi
          sleep 5
        done
        echo "composer did not finish in time"
        docker compose logs --tail=50 composer
        exit 1

    - name: Prepare Laravel (permissions, keys)
      shell: bash
      working-directory: ${{ runner.temp }}/toolshop
      run: |
        # The composer container chowns the sources to its own www-data (uid 82), while PHP-FPM runs
        # as another user, so Laravel cannot write logs or cache and answers 500 with an empty body.
        docker compose exec -T -u root laravel-api sh -c '
          [ -f .env ] || cp .env.example .env
          grep -q "^APP_KEY=.\+" .env || php artisan key:generate --force
          grep -q "^JWT_SECRET=.\+" .env || php artisan jwt:secret --force || true
          mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
          chmod -R a+rwX storage bootstrap/cache
          chmod a+r .env
          php artisan config:clear || true
          php -v | head -n1
        '

    - name: Migrate and seed the database
      shell: bash
      working-directory: ${{ runner.temp }}/toolshop
      run: |
        # The database container needs a moment before it accepts connections.
        for i in $(seq 1 20); do
          if docker compose exec -T laravel-api php artisan migrate:refresh --seed; then
            exit 0
          fi
          echo "Database not ready yet (attempt $i), waiting..."
          sleep 6
        done
        docker compose logs --tail=100 laravel-api
        exit 1

    - name: Wait until the API answers
      shell: bash
      working-directory: ${{ runner.temp }}/toolshop
      run: |
        for i in $(seq 1 40); do
          if curl -fsS http://localhost:8091/products > /dev/null; then
            echo "API is up"
            exit 0
          fi
          sleep 5
        done
        echo "=== API did not become ready ==="
        echo "--- API response (/products) ---"
        curl -si -H 'Accept: application/json' http://localhost:8091/products | head -c 2500 || true
        echo
        echo "--- Last application errors ---"
        docker compose exec -T laravel-api sh -c 'grep -h "\.ERROR" storage/logs/*.log 2>/dev/null | tail -n 3 | cut -c1-900; ls -la storage/logs' || true
        echo "--- Request replayed from the command line ---"
        docker compose exec -T laravel-api sh -c 'cd public && REQUEST_METHOD=GET REQUEST_URI=/products SCRIPT_FILENAME=index.php SCRIPT_NAME=/index.php php -d display_errors=1 -d error_reporting=-1 index.php 2>&1 | head -c 2500' || true
        docker compose ps -a
        exit 1

    - name: Wait until the web UI answers
      shell: bash
      working-directory: ${{ runner.temp }}/toolshop
      run: |
        # The UI container installs npm packages and compiles the Angular app on every start, which
        # takes a few minutes. If it crashed (for example a network hiccup during npm install),
        # start it again, up to two times.
        restarts=0
        for i in $(seq 1 90); do
          if curl -fsS http://localhost:4200 > /dev/null; then
            echo "Web UI is up"
            exit 0
          fi
          state=$(docker compose ps -a angular-ui --format '{{.State}}' 2>/dev/null | head -n1)
          if [ "$state" = "exited" ]; then
            echo "--- angular-ui exited, last log lines ---"
            docker compose logs --tail=40 angular-ui 2>&1 | cut -c1-300
            if [ "$restarts" -ge 2 ]; then
              echo "angular-ui keeps crashing"
              docker compose ps -a
              exit 1
            fi
            restarts=$((restarts + 1))
            echo "Starting angular-ui again (attempt $restarts)"
            docker compose up -d angular-ui
          fi
          sleep 5
        done
        echo "=== Web UI did not become ready ==="
        docker compose logs --tail=60 angular-ui 2>&1 | cut -c1-300
        docker compose ps -a
        exit 1
