name: Update visual baselines

# Run manually (Actions tab, Run workflow) after reviewing an intended UI change.
# Screenshots depend on the operating system's fonts, so baselines are always rendered on the CI
# runner and never on a developer machine.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render baselines
        run: npx playwright test --project=visual --update-snapshots
        env:
          TARGET: clean
          PLAYWRIGHT_HTML_OPEN: never
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
          else
            git commit -m "chore: update visual baselines"
            git push
          fi
